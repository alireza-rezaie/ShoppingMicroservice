services:
  catalogdb:
    container_name: catalogdb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - "mongo_data:/data/db"

  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DatabaseSettings__ConnectionString=mongodb://catalogdb:27017
      - DatabaseSettings__DatabaseName=CatalogDb
      - DatabaseSettings__CollectionName=Products
      - DatabaseSettings__BrandsCollection=Brands
      - DatabaseSettings__TypesCollection=Types
      - ElasticConfiguration__Uri=http://elasticsearch:9200
      - Jwt__Issuer=ShoppingMicroservice.Authentication
      - Jwt__Audience=ShoppingMicroservice
      - Jwt__Key=local-development-only-change-this-key-123456789
    depends_on:
      - catalogdb
    ports:
      - "9000:8080"
      - "8081"

  authdb:
    container_name: authdb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - MSSQL_SA_PASSWORD=LocalDev_StrongPass!2026
    ports:
      - "1433:1433"
    volumes:
      - auth_sql_data:/var/opt/mssql

  authentication.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__AuthDb=Server=authdb,1433;Database=ShoppingAuthDb;User Id=sa;Password=LocalDev_StrongPass!2026;Encrypt=True;TrustServerCertificate=True
      - Jwt__Issuer=ShoppingMicroservice.Authentication
      - Jwt__Audience=ShoppingMicroservice
      - Jwt__Key=local-development-only-change-this-key-123456789
      - Jwt__AccessTokenMinutes=15
      - Jwt__RefreshTokenDays=7
    depends_on:
      - authdb
    ports:
      - "9002:8080"

  basketdb:
    container_name: basketdb
    restart: always
    ports:
      - "6379:6379"

  basket.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=basketdb:6379
      - ASPNETCORE_HTTP_PORTS=8080
      - Jwt__Issuer=ShoppingMicroservice.Authentication
      - Jwt__Audience=ShoppingMicroservice
      - Jwt__Key=local-development-only-change-this-key-123456789
    depends_on:
      - basketdb
    ports:
      - "9001:8080"
